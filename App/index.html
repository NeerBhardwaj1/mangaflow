<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06080f" />
  <title>MangaFlow</title>
  <meta name="description" content="Read Manga, Manhwa & Comics free in HD" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./images/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>

  <div id="app-shell">

    <!-- Top Mobile App Bar (mnavbar-top) -->
    <header id="app-header" class="app-header mnavbar-top">
      <div class="app-header-glow-mesh"></div>
      <div class="app-header-inner">
        <a href="#/" class="app-header-brand-link" id="header-brand-home" aria-label="MangaFlow Home">
          <div class="app-logo-wrap">
            <img src="./images/logo.png" alt="MangaFlow" class="app-logo" />
            <div class="app-logo-ambient-ring"></div>
          </div>
          <div class="app-brand-stack">
            <span class="app-brand">Manga<span class="app-brand-flow">Flow</span></span>
            <span class="app-brand-badge">PRO</span>
          </div>
        </a>

        <div class="app-header-actions">
          <!-- Frosted Glass Search Capsule -->
          <button class="header-search-capsule" id="header-search-btn" aria-label="Search Manga">
            <span class="search-capsule-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <span class="search-capsule-text">Search...</span>
            <span class="search-capsule-kbadge">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </span>
          </button>

          <!-- Surprise Me 3D Glass Action -->
          <button class="header-action-glass-btn" id="header-dice-btn" aria-label="Surprise Me" title="Random Manga">
            <span class="dice-emoji">🎲</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Fullscreen Search Overlay -->
    <div id="search-overlay" class="search-overlay">
      <div class="search-overlay-bar">
        <div class="search-overlay-input-wrap">
          <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-overlay-input" placeholder="Search title, genre, author..." autocomplete="off" />
          <button class="search-input-clear-btn" id="search-overlay-clear" aria-label="Clear Search" style="display:none;">✕</button>
        </div>
        <button class="search-overlay-close" id="search-overlay-close">Cancel</button>
      </div>
      <div id="search-overlay-results" class="search-overlay-results"></div>
    </div>

    <!-- Server Connection Settings Modal -->
    <div id="server-modal" class="app-modal-backdrop" style="display:none;">
      <div class="app-modal-sheet">
        <div class="modal-drag-pill"></div>
        <div class="modal-header">
          <h3>Backend Server Settings</h3>
          <button class="modal-close-btn" id="server-modal-close">✕</button>
        </div>
        <p class="modal-desc">Configure the MangaFlow backend API URL that this mobile app communicates with.</p>
        
        <div class="modal-input-group">
          <label for="server-url-input">Server API Base URL</label>
          <input type="text" id="server-url-input" placeholder="http://192.168.1.102:3000" />
        </div>

        <div class="modal-quick-hosts">
          <button type="button" class="btn-quick-host" id="btn-quick-lan">Wi-Fi (192.168.1.102)</button>
          <button type="button" class="btn-quick-host" id="btn-quick-local">Localhost (3000)</button>
          <button type="button" class="btn-quick-host" id="btn-quick-emulator">Android Emulator</button>
        </div>

        <div class="modal-actions">
          <button class="btn-modal-test" id="btn-test-server">Ping Server</button>
          <button class="btn-modal-save" id="btn-save-server">Save & Apply</button>
        </div>
        <div id="server-test-result" class="modal-ping-status"></div>
      </div>
    </div>

    <!-- Main Scrollable Content -->
    <main id="app-content" class="app-content">
      <div class="app-loader">
        <div class="app-spinner"></div>
      </div>
    </main>

    <!-- Bottom Mobile Navigation Bar (mnavbar-bottom) -->
    <div class="mnavbar-dock-wrap" id="app-tabs-wrap">
      <nav id="app-tabs" class="mnavbar-dock">
        <a href="#/" class="mnavbar-tab active" data-tab="home" id="tab-home">
          <div class="mnavbar-tab-icon-wrap">
            <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="tab-label">Home</span>
        </a>

        <a href="#/latest" class="mnavbar-tab" data-tab="latest" id="tab-latest">
          <div class="mnavbar-tab-icon-wrap">
            <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <span class="tab-label">Updates</span>
        </a>

        <a href="#/search" class="mnavbar-tab" data-tab="search" id="tab-search">
          <div class="mnavbar-tab-icon-wrap">
            <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <span class="tab-label">Browse</span>
        </a>

        <a href="#/library" class="mnavbar-tab" data-tab="library" id="tab-library">
          <div class="mnavbar-tab-icon-wrap">
            <svg class="tab-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M6 6h10"></path>
              <path d="M6 10h7"></path>
            </svg>
            <span id="lib-dot" class="tab-dot" style="display:none;"></span>
          </div>
          <span class="tab-label">Library</span>
        </a>
      </nav>
    </div>

    <!-- Toast Notifications -->
    <div id="app-toast" class="app-toast" style="display:none;">
      <span id="app-toast-msg"></span>
    </div>

  </div>

  <script src="./js/haptics.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/downloader.js"></script>
  <script src="./js/pullToRefresh.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/views/homeView.js"></script>
  <script src="./js/views/searchView.js"></script>
  <script src="./js/views/detailView.js"></script>
  <script src="./js/views/readerView.js"></script>
  <script src="./js/views/libraryView.js"></script>
  <script src="./js/views/latestView.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
